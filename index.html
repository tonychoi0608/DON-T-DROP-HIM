<script>
"use strict";
/* ============================================================
   부장님이 잠드셨다 — 30개 고유 맵 캠페인 v0.6.3
   1인(양손 연습) / 2인(키보드 분할) / 모바일 터치 · 커스텀 Verlet 물리
   ============================================================ */
const cv = document.getElementById('cv'), cx = cv.getContext('2d');
const VW = 1280, VH = 720;
const clamp = (v,a,b)=>v<a?a:v>b?b:v;
const lerp  = (a,b,t)=>a+(b-a)*t;
const rnd   = (a,b)=>b===undefined?Math.random()*a:a+Math.random()*(b-a);
const dist2 = (ax,ay,bx,by)=>{const dx=ax-bx,dy=ay-by;return Math.sqrt(dx*dx+dy*dy)};
const DEBUG = location.search.indexOf('debug')>=0;
const TOUCH_UI = (window.matchMedia&&matchMedia('(pointer: coarse)').matches)||location.search.indexOf('touch')>=0;
const CAM_YUP = TOUCH_UI?100:0; // 터치 UI에서 월드를 위로 올려 하단 버튼과 겹침 방지
document.body.classList.toggle('touch',TOUCH_UI);

/* ---------------- 입력 ---------------- */
const keys = {}, pressed = {};
const GAMEKEYS = new Set(['KeyA','KeyD','KeyW','KeyS','KeyF','ArrowLeft','ArrowRight','ArrowUp','ArrowDown',
  'ShiftLeft','ShiftRight','KeyL','KeyR','KeyT','KeyM','KeyV','KeyP','KeyG','KeyI','Escape','Enter','Digit1','Digit2','KeyK','Digit9','Digit0','Space']);
function setInput(code,down){
  if(down){ if(!keys[code]) pressed[code]=true; keys[code]=true; ensureAudio(); }
  else keys[code]=false;
}
window.addEventListener('keydown',e=>{
  if (GAMEKEYS.has(e.code)) e.preventDefault();
  setInput(e.code,true);
});
window.addEventListener('keyup',e=>setInput(e.code,false));

const virtualContacts=new Map(), virtualCounts={}, virtualButtonCounts=new Map();
function beginVirtualContact(contactId,code,btn){
  if(!code||virtualContacts.has(contactId)) return;
  virtualContacts.set(contactId,{code,btn});
  virtualCounts[code]=(virtualCounts[code]||0)+1;
  virtualButtonCounts.set(btn,(virtualButtonCounts.get(btn)||0)+1);
  btn.classList.add('active'); setInput(code,true);
}
function releaseVirtualContact(contactId){
  const hit=virtualContacts.get(contactId); if(!hit) return;
  virtualContacts.delete(contactId);
  virtualCounts[hit.code]=Math.max(0,(virtualCounts[hit.code]||1)-1);
  const btnCount=Math.max(0,(virtualButtonCounts.get(hit.btn)||1)-1);
  if(btnCount) virtualButtonCounts.set(hit.btn,btnCount);
  else { virtualButtonCounts.delete(hit.btn); hit.btn.classList.remove('active'); }
  if(!virtualCounts[hit.code]) setInput(hit.code,false);
}
if(TOUCH_UI){
  const nativeTouch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
  for(const btn of document.querySelectorAll('.touchBtn')){
    btn.addEventListener('touchstart',e=>{
      e.preventDefault();
      const code=btn.dataset.code;
      for(const touch of e.changedTouches) beginVirtualContact('t'+touch.identifier,code,btn);
    },{passive:false});
    btn.addEventListener('pointerdown',e=>{
      if(nativeTouch&&e.pointerType==='touch') return;
      const code=btn.dataset.code; if(!code) return;
      e.preventDefault();
      try{ btn.setPointerCapture(e.pointerId); }catch(_){}
      beginVirtualContact('p'+e.pointerId,code,btn);
    });
    btn.addEventListener('lostpointercapture',e=>releaseVirtualContact('p'+e.pointerId));
  }
  window.addEventListener('touchend',e=>{
    let handled=false;
    for(const touch of e.changedTouches){
      const id='t'+touch.identifier;
      if(virtualContacts.has(id)){ handled=true; releaseVirtualContact(id); }
    }
    if(handled) e.preventDefault();
  },{passive:false});
  window.addEventListener('touchcancel',e=>{
    for(const touch of e.changedTouches) releaseVirtualContact('t'+touch.identifier);
  },{passive:false});
  window.addEventListener('pointerup',e=>releaseVirtualContact('p'+e.pointerId));
  window.addEventListener('pointercancel',e=>releaseVirtualContact('p'+e.pointerId));
  window.addEventListener('contextmenu',e=>e.preventDefault());
}
/* ---------------- 조그다이얼 가상 스틱: 한 손가락으로 이동·점프·숙이기 ---------------- */
const stickResets=[];
if(TOUCH_UI){
  const nativeTouch=('ontouchstart' in window)||(navigator.maxTouchPoints||0)>0;
  for(const el of document.querySelectorAll('.stick')){
    const isBack=el.closest('.controlSide').classList.contains('back');
    const codes=isBack?{L:'KeyA',R:'KeyD',U:'KeyW',D:'KeyS'}:{L:'ArrowLeft',R:'ArrowRight',U:'ArrowUp',D:'ArrowDown'};
    const knob=el.querySelector('.stickKnob');
    let pid=null,cx0=0,cy0=0,rad=56;
    const st={L:false,R:false,U:false,D:false};
    const apply=(nx,ny)=>{
      const on={L:nx<-0.30,R:nx>0.30,U:ny<-0.38,D:ny>0.42};
      for(const k in on) if(on[k]!==st[k]){ st[k]=on[k]; setInput(codes[k],on[k]); }
      knob.style.transform='translate('+Math.round(nx*rad*0.55)+'px,'+Math.round(ny*rad*0.55)+'px)';
    };
    const reset=()=>{ pid=null; el.classList.remove('active'); apply(0,0); };
    stickResets.push(reset);
    const down=(id,x,y)=>{
      if(pid!==null) return;
      const r=el.getBoundingClientRect(); rad=r.width/2; cx0=r.left+rad; cy0=r.top+r.height/2;
      pid=id; el.classList.add('active'); ensureAudio(); mv(id,x,y);
    };
    const mv=(id,x,y)=>{
      if(pid!==id) return;
      let dx=(x-cx0)/rad, dy=(y-cy0)/rad;
      const d=Math.hypot(dx,dy);
      if(d>1){ dx/=d; dy/=d; }
      apply(dx,dy);
    };
    const up=id=>{ if(pid===id) reset(); };
    el.addEventListener('touchstart',e=>{ e.preventDefault(); const t=e.changedTouches[0]; down('t'+t.identifier,t.clientX,t.clientY); },{passive:false});
    window.addEventListener('touchmove',e=>{
      let ours=false;
      for(const t of e.changedTouches) if(pid==='t'+t.identifier){ ours=true; mv('t'+t.identifier,t.clientX,t.clientY); }
      if(ours) e.preventDefault();
    },{passive:false});
    window.addEventListener('touchend',e=>{ for(const t of e.changedTouches) up('t'+t.identifier); },{passive:false});
    window.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches) up('t'+t.identifier); },{passive:false});
    el.addEventListener('pointerdown',e=>{
      if(nativeTouch&&e.pointerType==='touch') return;
      e.preventDefault();
      try{ el.setPointerCapture(e.pointerId); }catch(_){}
      down('p'+e.pointerId,e.clientX,e.clientY);
    });
    el.addEventListener('pointermove',e=>{ if(!(nativeTouch&&e.pointerType==='touch')) mv('p'+e.pointerId,e.clientX,e.clientY); });
    el.addEventListener('pointerup',e=>up('p'+e.pointerId));
    el.addEventListener('lostpointercapture',e=>up('p'+e.pointerId));
  }
}
window.addEventListener('blur',()=>{
  for(const k in keys) keys[k]=false;
  for(const contactId of [...virtualContacts.keys()]) releaseVirtualContact(contactId);
  for(const r of stickResets) r();
  if(state==='play') state='pause';
  if(scrapeGain) scrapeGain.gain.value=0;
});
let clickPt = null;
cv.addEventListener('pointerdown',e=>{
  const r=cv.getBoundingClientRect();
  clickPt={x:(e.clientX-r.left)*VW/r.width, y:(e.clientY-r.top)*VH/r.height};
  ensureAudio();
});

/* ---------------- 사운드 (전부 신스, 외부 파일 없음) ---------------- */
let AC=null, master=null, scrapeGain=null, muted=false;
let micStream=null, micSource=null, micAnalyser=null, micData=null;
let micEnabled=false, micStatus='OFF', micLevel=0, micHitCd=0;
function ensureAudio(){
  if (AC) { if(AC.state==='suspended') AC.resume().catch(()=>{}); return; }
  try{
    AC = new (window.AudioContext||window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = 0.5; master.connect(AC.destination);
    const len = AC.sampleRate*1.2, buf = AC.createBuffer(1,len,AC.sampleRate), d = buf.getChannelData(0);
    for(let i=0;i<len;i++) d[i]=Math.random()*2-1;
    const src=AC.createBufferSource(); src.buffer=buf; src.loop=true;
    const bp=AC.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=420; bp.Q.value=0.8;
    scrapeGain=AC.createGain(); scrapeGain.gain.value=0;
    src.connect(bp); bp.connect(scrapeGain); scrapeGain.connect(master); src.start();
  }catch(err){ AC=null; }
}
function tone(f0,f1,dur,type,vol,delay){
  if(!AC||muted) return;
  const t=AC.currentTime+(delay||0);
  const o=AC.createOscillator(), g=AC.createGain();
  o.type=type||'sine'; o.frequency.setValueAtTime(f0,t);
  o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(0.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+0.02);
}
function noiseHit(dur,vol,freq){
  if(!AC||muted) return;
  const t=AC.currentTime, n=Math.floor(AC.sampleRate*dur), b=AC.createBuffer(1,n,AC.sampleRate), d=b.getChannelData(0);
  for(let i=0;i<n;i++) d[i]=(Math.random()*2-1)*(1-i/n);
  const s=AC.createBufferSource(); s.buffer=b;
  const f=AC.createBiquadFilter(); f.type='lowpass'; f.frequency.value=freq||500;
  const g=AC.createGain(); g.gain.value=vol;
  s.connect(f); f.connect(g); g.connect(master); s.start(t);
}
async function toggleMic(){
  if(micEnabled){
    if(micStream) for(const tr of micStream.getTracks()) tr.stop();
    micStream=micSource=micAnalyser=micData=null; micEnabled=false; micStatus='OFF';
    toast('🎙 실제 마이크 OFF'); return;
  }
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){
    micStatus='지원 안 됨'; toast('이 브라우저는 마이크를 지원하지 않습니다'); return;
  }
  try{
    ensureAudio();
    micStatus='권한 확인 중';
    micStream=await navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}});
    if(!AC) ensureAudio();
    micSource=AC.createMediaStreamSource(micStream);
    micAnalyser=AC.createAnalyser(); micAnalyser.fftSize=512; micAnalyser.smoothingTimeConstant=0.35;
    micData=new Uint8Array(micAnalyser.fftSize); micSource.connect(micAnalyser);
    micEnabled=true; micStatus='ON'; toast('🎙 실제 마이크 ON — 놀라도 소리 지르지 마세요');
  }catch(err){ micEnabled=false; micStatus='권한 거부'; toast('마이크를 켜지 못했습니다'); }
}
function sampleMic(){
  if(!micEnabled||!micAnalyser||!micData){ micLevel=0; return 0; }
  micAnalyser.getByteTimeDomainData(micData);
  let sum=0; for(const v of micData){ const n=(v-128)/128; sum+=n*n; }
  micLevel=Math.sqrt(sum/micData.length); return micLevel;
}
const sThud   = v=>{ noiseHit(0.1,Math.min(0.8,v),380); tone(90,45,0.14,'sine',0.4); };

/* 배치 곡선: 맵 진행도 t(0~1)에서의 장애물 밀도 가중치 */
const LAYOUT_W={
  even:  t=>1,
  front: t=>1.7-1.3*t,
  back:  t=>0.35+1.4*t,
  mid:   t=>Math.max(0.25,1.35-Math.abs(t-0.5)*2.4),
  waves: (t,k)=>0.22+1.5*Math.pow(Math.sin(t*Math.PI*k),2),
  breath:t=>0.3+Math.abs(t-0.5)*1.9,
  finale:t=>t<0.55?0.3:1.9,
  rhythm:t=>1
};
function makeMapSpec(level){
  const R=MAP_RECIPES[clamp(level,1,MAP_RECIPES.length)-1];
  const length=R.L, goalCenter=length-360;
  const px=f=>Math.round(f*length/10)*10;
  const taxiX0=Math.min(px(R.tx),length-1920);
  const cp2=px(R.cp[0]), cp3=px(R.cp[1]);
  const catX=clamp(px(R.cat),520,length-980), trashX=clamp(px(R.tr),700,length-900);
  return {
    level,length,goalCenter,goalX0:goalCenter-220,goalX1:goalCenter+220,
    theme:MAP_THEMES[R.th],recipe:R,
    seed:(Math.imul(level,2246822519)^0x9e3779b9)>>>0,
    hazardGroups:R.g,
    checkpoints:[{x:360},{x:cp2},{x:cp3}],
    catX,trashX,taxiX0,taxiX1:taxiX0+360,taxiSkip:800,
    silentXs:[px(R.sil[0]),px(R.sil[1])],
    bottleXs:[trashX-190,trashX-145,trashX-105,cp2+100,cp3-130],
    landmarkX:Math.round(length*0.73),signature:'',obstacleCount:0
  };
}

let activeMap=null;
let CHECKPOINTS=[];
const solids = [];
function box(x,y,w,h,tag){ solids.push({x,y,w,h,tag:tag||''}); return solids[solids.length-1]; }
function addObstacleGroup(x,kind,rng,level,hz){
  const H=v=>Math.min(84,Math.round(v));
  const h=H((16+rng()*14+level*0.8)*hz);
  const clear=Math.max(52,Math.round(61-level*0.55)); // 천장 통과 여유: lvl1=60, 16+에선 52(엇갈림 박스는 -8)
  if(kind===0){        // 오르막 3계단
    for(let i=0;i<3;i++){ const hh=H(h+i*7); box(x+i*34,G_Y-hh,30,hh,'level'); }
  } else if(kind===1){ // 낮은 천장 3연속
    const hh=46+Math.floor(rng()*16), y=G_Y-clear-hh;
    for(let i=0;i<3;i++) box(x+i*38,y+(i%2)*8,34,hh,'danger');
  } else if(kind===2){ // 상승 계단
    for(let i=0;i<3;i++){ const hh=H(18*(i+1)*hz+6); box(x+i*34,G_Y-hh,32,hh,'stair'); }
  } else if(kind===3){ // 문턱-기둥-문턱
    box(x,G_Y-h,30,h,'level'); box(x+38,G_Y-H(h+18),30,H(h+18),'level'); box(x+76,G_Y-h,30,h,'level');
  } else if(kind===4){ // 구름다리
    const y=G_Y-82-Math.floor(rng()*20);
    for(let i=0;i<3;i++) box(x+i*38,y,36,20,'bridge');
  } else if(kind===5){ // 울타리(중앙 위험)
    for(let i=0;i<3;i++){ const hh=H(22+rng()*(24+level)*hz*0.8); box(x+i*36,G_Y-hh,32,hh,i===1?'danger':'level'); }
  } else if(kind===6){ // 굵은 외벽 하나
    const hh=H(h*1.3+14); box(x+20,G_Y-hh,56,hh,'level');
  } else if(kind===7){ // 긴 좌판(양끝 디딤돌로 넘기)
    const hb=H(40+rng()*16);
    box(x,G_Y-hb,150,18,'bridge'); box(x+16,G_Y-14,22,14,'stair'); box(x+112,G_Y-14,22,14,'stair');
  } else if(kind===8){ // 터널(바닥 턱 + 낮은 천장)
    box(x+16,G_Y-16,100,16,'stair');
    const hh=50; box(x,G_Y-16-(clear+8)-hh,132,hh,'danger');
  } else if(kind===9){ // 피라미드(정점 위험)
    const s=[0.5,0.8,1.15,0.8,0.5];
    for(let i=0;i<5;i++){ const hh=H(h*s[i]+8); box(x+i*27,G_Y-hh,24,hh,i===2?'danger':'level'); }
  } else if(kind===10){ // 지그재그 단차
    for(let i=0;i<4;i++){ const hh=H(i%2?h*1.05+10:h*0.5+6); box(x+i*33,G_Y-hh,29,hh,'level'); }
  } else if(kind===11){ // 이중 천장(높이 엇갈림)
    const hh=48+Math.floor(rng()*10);
    box(x,G_Y-(clear+10)-hh,60,hh,'danger');
    box(x+96,G_Y-Math.max(50,clear-6)-hh,60,hh,'danger');
  } else if(kind===12){ // 오르는 징검 발판
    for(let i=0;i<3;i++) box(x+i*46,G_Y-38-i*15,40,15,'bridge');
  } else {             // 내리막 3계단
    for(let i=0;i<3;i++){ const hh=H(h+(2-i)*9+6); box(x+i*34,G_Y-hh,30,hh,'level'); }
  }
}
function buildLevelWorld(level){
  activeMap=makeMapSpec(level);
  const R=activeMap.recipe;
  WORLD=activeMap.length; GOAL_CX=activeMap.goalCenter; GOAL_X0=activeMap.goalX0; GOAL_X1=activeMap.goalX1;
  CHECKPOINTS=activeMap.checkpoints;
  solids.length=0; box(-300,G_Y,WORLD+600,320,'ground');
  const reserved=[
    [0,620],[GOAL_X0-400,WORLD],
    ...CHECKPOINTS.slice(1).map(cp=>[cp.x-120,cp.x+170]),
    [activeMap.taxiX0-100,activeMap.taxiX1+100],
    [activeMap.taxiX0+activeMap.taxiSkip-90,activeMap.taxiX1+activeMap.taxiSkip+90]
  ];
  const blocked=x=>reserved.some(z=>x+150>z[0]&&x<z[1]);
  const x0=640, x1=GOAL_X0-420;
  const slots=[]; for(let x=x0;x<x1;x+=40) if(!blocked(x)) slots.push(x);
  const freePx=slots.length*40;
  const rng=mapRng(activeMap.seed);
  const wfn=LAYOUT_W[R.lay]||LAYOUT_W.even;
  const waveK=3+level%3;
  /* 밀도는 실제 남은 공간에서 계산: 목표 간격이 레벨 1의 160px에서 30의 96px까지 줄어든다 */
  const sp=Math.max(96,162-level*2.3)*(R.lay==='rhythm'?0.82:1);
  const groups=clamp(Math.round(freePx/sp),8,R.g+18);
  activeMap.hazardGroups=groups;
  const minGap=Math.max(92,sp*0.6);
  const chosen=[];
  for(let n=0;n<groups;n++){
    let total=0;
    const w=slots.map(x=>{
      if(chosen.some(c=>Math.abs(c-x)<minGap)) return 0;
      const t=(x-x0)/(x1-x0);
      const v=Math.max(0,wfn(t,waveK)); total+=v; return v;
    });
    if(total<=0) break;
    let r=rng()*total, pick=-1;
    for(let i=0;i<slots.length;i++){ r-=w[i]; if(r<=0&&w[i]>0){ pick=slots[i]; break; } }
    if(pick<0){ for(let i=slots.length-1;i>=0;i--) if(w[i]>0){ pick=slots[i]; break; } }
    if(pick<0) break;
    chosen.push(pick);
  }
  chosen.sort((a,b)=>a-b);
  for(let i=0;i<chosen.length;i++) addObstacleGroup(chosen[i],R.kinds[i%R.kinds.length],rng,level,R.hz);
  activeMap.obstacleCount=solids.length-1;
  activeMap.signature=solids.slice(1).map(s=>[Math.round(s.x),Math.round(s.y),s.w,s.h,s.tag].join(':')).join('|');
}

function P(x,y,m,r){ return {x,y,px:x,py:y,m:m||1,r:r||5.5,hitCd:0,onGround:false}; }
function S(a,b,stiff,mode){ return {a,b,rest:dist2(a.x,a.y,b.x,b.y),stiff:stiff||1,mode:mode||0}; }

let boss = null;
function buildBoss(ax,ay,bx,by){
  const L=lerp, hx=ax, hy=ay;
  const lh=P(hx-4,hy,0.7,5), rh=P(hx+4,hy,0.7,5);
  const le=P(L(ax,bx,0.14),ay+7,0.9,5), re=P(L(ax,bx,0.14),ay+10,0.9,5);
  const neck=P(L(ax,bx,0.3),ay+13,1.2,6);
  const head=P(neck.x+9,neck.y+16,1.6,15);
  const chest=P(L(ax,bx,0.46),ay+16,2.6,11);
  const pelvis=P(L(ax,bx,0.63),ay+16,2.6,11);
  const lk=P(L(ax,bx,0.8),ay+10,0.9,5.5), rk=P(L(ax,bx,0.8),ay+7,0.9,5.5);
  const la=P(bx-4,by,0.7,5), ra=P(bx+4,by,0.7,5);
  const pts={lh,rh,le,re,neck,head,chest,pelvis,lk,rk,la,ra};
  const sticks=[
    S(lh,le),S(rh,re),S(le,neck),S(re,neck),
    S(neck,head),S(neck,chest),S(chest,pelvis),
    S(pelvis,lk),S(pelvis,rk),S(lk,la),S(rk,ra),
    S(lh,rh),S(la,ra),
    S(neck,pelvis,0.85),
    S(head,chest,1,1),
    S(pelvis,la,0.9,1),S(pelvis,ra,0.9,1),
    S(neck,lh,0.6,2),S(neck,rh,0.6,2)
  ];
  boss = {pts, sticks, list:Object.values(pts),
    headEnd:[head,neck,chest,lh,rh,le,re],
    tailEnd:[pelvis,lk,rk,la,ra]};
}
function bossVel(p){ return dist2(p.x,p.y,p.px,p.py)/SDT; }
function setVel(p,vx,vy){ p.px=p.x-vx*SDT; p.py=p.y-vy*SDT; }

function collidePt(p){
  for(const s of solids){
    const nx=clamp(p.x,s.x,s.x+s.w), ny=clamp(p.y,s.y,s.y+s.h);
    let dx=p.x-nx, dy=p.y-ny, d=Math.sqrt(dx*dx+dy*dy);
    if(d>=p.r) continue;
    const spd=p.spd||0, vy=(p.y-p.py)/SDT;
    if(d>0.0001){
      // 모서리 관용: 옆에서 밀렸는데 윗면 근처면 위로 올려보냄
      if(Math.abs(dx)>Math.abs(dy) && p.y-p.r < s.y+14 && vy>=-40){ p.y=s.y-p.r; }
      else { p.x=nx+dx/d*p.r; p.y=ny+dy/d*p.r; }
    } else if(s.tag==='danger'){
      cx.fillStyle='#6b2c3d'; cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#ff6b6b'; cx.fillRect(s.x,s.y,s.w,4);
      cx.fillStyle='rgba(255,214,140,0.35)';
      for(let x=s.x-10;x<s.x+s.w;x+=24){
        cx.beginPath(); cx.moveTo(x,s.y+s.h); cx.lineTo(x+10,s.y+s.h); cx.lineTo(x+28,s.y); cx.lineTo(x+18,s.y); cx.closePath(); cx.fill();
      }
    } else if(s.tag==='level'){
      cx.fillStyle='#4b3548'; cx.fillRect(s.x,s.y,s.w,s.h);
      cx.fillStyle='#c85568'; cx.fillRect(s.x,s.y,s.w,4);
    } else {
      const upPen=p.y-s.y+p.r, downPen=s.y+s.h-p.y+p.r, lPen=p.x-s.x+p.r, rPen=s.x+s.w-p.x+p.r;
      const m=Math.min(upPen,downPen,lPen,rPen);
      if(m===upPen) p.y=s.y-p.r; else if(m===downPen) p.y=s.y+s.h+p.r;
      else if(m===lPen) p.x=s.x-p.r; else p.x=s.x+s.w+p.r;
    }
    if(p.y<=s.y){ p.onGround=true; }
    // 마찰 + 반발 제거
    p.px = p.x-(p.x-p.px)*0.55;
    p.py = p.y;
    if(spd>620 && p.hitCd<=0){
      p.hitCd=0.5;
      onBossImpact(p, spd);
    }
  }
}
function stepBossPhysics(){
  for(const p of boss.list){
    const vx=(p.x-p.px)*0.996, vy=(p.y-p.py)*0.996;
    p.px=p.x; p.py=p.y;
    let ddx=vx, ddy=vy+VG*SDT*SDT;
    const mm=Math.sqrt(ddx*ddx+ddy*ddy);
    if(mm>30){ ddx*=30/mm; ddy*=30/mm; }
    p.x+=ddx; p.y+=ddy;
    p.spd=Math.sqrt(ddx*ddx+ddy*ddy)/SDT; // 제약 적용 전 실제 속도(충격 판정용)
    p.onGround=false;
  }
  // 그립 핀
  for(const c of carriers) c.applyGrip();
  for(let it=0; it<ITER; it++){
    for(const st of boss.sticks){
      const a=st.a,b=st.b;
      let dx=b.x-a.x, dy=b.y-a.y, d=Math.sqrt(dx*dx+dy*dy)||0.0001;
      if(st.mode===1 && d>=st.rest*0.8) continue;
      if(st.mode===2 && d<=st.rest*1.15) continue;
      const target=st.mode===1?st.rest*0.8:(st.mode===2?st.rest*1.15:st.rest);
      const diff=(d-target)/d*0.5*st.stiff;
      const wa=b.m/(a.m+b.m), wb=a.m/(a.m+b.m);
      a.x+=dx*diff*wa*2*0.5; a.y+=dy*diff*wa;
      b.x-=dx*diff*wb; b.y-=dy*diff*wb;
    }
    for(const c of carriers) c.applyGrip();
    for(const p of boss.list) collidePt(p);
  }
  for(const p of boss.list) if(p.hitCd>0) p.hitCd-=SDT;
  if(!isFinite(boss.pts.chest.x)||!isFinite(boss.pts.chest.y)) respawn(false);
}

/* ---------------- 운반자(캐리어) ---------------- */
class Carrier{
  constructor(role,x,color,keymap,label){
    this.role=role; this.color=color; this.km=keymap; this.label=label;
    this.reset(x);
  }
  reset(x){
    this.x=x; this.y=G_Y-58; this.w=26; this.h=58;
    this.vx=0; this.vy=0; this.facing=1; this.crouch=false; this.grounded=true;
    this.grip=true; this.stretch=0; this.slipT=0; this.walkPh=0; this.regrabHint=false;
  }
  anchor(){
    const off = this.role==='front' ? -20 : 20;
    return {x:this.x+this.w/2+off, y:this.y+(this.crouch?10:5)};
  }
  targets(){
    return this.role==='front' ? [boss.pts.lh,boss.pts.rh] : [boss.pts.la,boss.pts.ra];
  }
  midTarget(){
    const t=this.targets();
    return {x:(t[0].x+t[1].x)/2, y:(t[0].y+t[1].y)/2};
  }
  applyGrip(){
    if(!this.grip||!boss) return;
    const an=this.anchor(), t=this.targets();
    const m=this.midTarget();
    const st=dist2(an.x,an.y,m.x,m.y);
    if(st>this.stretch) this.stretch=st;
    const saving=friendSave&&friendSave.holder===this.side()&&friendSave.t<=3.2;
    const k=saving?0.5:0.42;
    t[0].x+=(an.x-4-t[0].x)*k; t[0].y+=(an.y-t[0].y)*k;
    t[1].x+=(an.x+4-t[1].x)*k; t[1].y+=(an.y-t[1].y)*k;
  }
  update(dt){
    const k=this.km;
    let dir=0; if(keys[k.L])dir--; if(keys[k.R])dir++;
    this.crouch = !!keys[k.C] && this.grounded;
    const carrying=this.grip;
    const stretchDrag = 1 - clamp((this.stretch-45)/70,0,0.55);
    const maxS=(carrying?205:268)*(this.crouch?0.6:1)*stretchDrag;
    const target=dir*maxS;
    const acc = 1700*dt;
    this.vx += clamp(target-this.vx, -acc, acc);
    if(dir!==0) this.facing=dir;
    let jumped=false;
    for(const jk of k.J){ if(pressed[jk]) jumped=true; }
    if(jumped && this.grounded){
      this.vy = carrying?-650:-730; this.grounded=false; sJump();
    }
    this.vy += GRAV*dt; this.vy=clamp(this.vy,-2000,1400);
    // 자세 전환(발 위치 유지)
    const th=this.crouch?42:58;
    if(th!==this.h){
      const ny=this.y+(this.h-th);
      if(th>this.h && this.hitsSolid(this.x,ny,this.w,th)) { /* 천장 → 못 일어남 */ this.crouch=true; }
      else { this.y=ny; this.h=th; }
    }
    // X 이동
    this.x += this.vx*dt;
    for(const s of solids){
      if(!this.overlap(s)) continue;
      const feet=this.y+this.h;
      if(feet-s.y<=27 && this.vy>=0 && !this.hitsSolid(this.x, s.y-this.h, this.w, this.h)){
        this.y=s.y-this.h; this.grounded=true;
      } else {
        if(this.vx>0) this.x=s.x-this.w; else if(this.vx<0) this.x=s.x+s.w;
        this.vx=0;
      }
    }
    this.x=clamp(this.x,-260,WORLD-40);
    // Y 이동
    this.y += this.vy*dt;
    this.grounded=false;
    for(const s of solids){
      if(!this.overlap(s)) continue;
      if(this.vy>=0 && this.y+this.h-s.y < Math.max(30,this.vy*dt+12)){
        this.y=s.y-this.h; this.vy=0; this.grounded=true;
      } else if(this.vy<0){
        this.y=s.y+s.h; this.vy=0;
      } else {
        if(this.vx>=0) this.x=s.x-this.w; else this.x=s.x+s.w;
      }
    }
    // 그립 토글
    let gPressed=false;
    for(const gk of k.G){ if(pressed[gk]) gPressed=true; }
    const m=this.midTarget(), an=this.anchor();
    const rescueWindow=friendSave||nearMissArmed||bothLoose;
    const near=dist2(an.x,an.y,m.x,m.y)<(rescueWindow?96:64);
    this.regrabHint = !this.grip && near;
    if(gPressed){
      if(this.grip){
        this.grip=false; lastGripChange[this.side()]=runTime; gripDropCnt++;
        addFault(this.side(),5,'release'); sSlip(); toast(this.label+'가 손을 놓았다!');
      }
      else if(near){ this.grip=true; lastGripChange[this.side()]=runTime; onRegrip(this.side()); sChime(); }
    }
    // 과신전 슬립
    const saveGripBoost=friendSave&&friendSave.holder===this.side()&&friendSave.t<=3.2?1.35:1;
    if(this.grip && this.stretch>diff.grip*saveGripBoost){ this.slipT+=dt; if(this.slipT>diff.slip){
      this.grip=false; this.slipT=0; lastGripChange[this.side()]=runTime; gripDropCnt++;
      addFault(this.side(),12,'slip'); sSlip();
      toast('⚠ '+this.label+' 손이 미끄러졌다!'); shake=8;
    }} else this.slipT=0;
    this.walkPh += Math.abs(this.vx)*dt*0.05;
    this.stretchShown=this.stretch; this.stretch=0;
  }
  side(){ return this.role==='front'?'front':'back'; }
  overlap(s){ return this.x<s.x+s.w && this.x+this.w>s.x && this.y<s.y+s.h && this.y+this.h>s.y; }
  hitsSolid(x,y,w,h){
    for(const s of solids) if(x<s.x+s.w&&x+w>s.x&&y<s.y+s.h&&y+h>s.y) return true;
    return false;
  }
}

  if(!mission) return false;
  if(mission.id==='quiet') return noiseCnt<=3;
  if(mission.id==='head') return headHitCnt===0;
  if(mission.id==='fast') return runTime<=180;
  if(mission.id==='balance'){ const p=faultPercent(); return Math.abs(p.front-p.back)<=10; }
  return gripDropCnt===0;
}

function onBossImpact(p,spd){
  if(state!=='play') return;
  const isHead = p===boss.pts.head;
  let dmg = Math.min(24,(spd-620)/46) * (isHead?1.7:1) * diff.dmg * sleepSensitivity();
  if(dmg<=0) return;
  meter -= dmg; sinceDmg=0;
  sThud(Math.min(0.8, dmg/12));
  shake=Math.max(shake, Math.min(14,dmg*1.2));
  const side = boss.headEnd.indexOf(p)>=0 ? 'front':'back';
  addFault(side, dmg, 'impact');
  if(isHead) headHitCnt++;
  triggerIncident(p,spd,dmg);
  if(dmg>5){
    noiseCnt++;
    spawnP('text',p.x,p.y-24,'쿵!');
    for(let i=0;i<4;i++) spawnP('star',p.x,p.y-10);
    if(isHead) bossSay('으윽…!',1.2);
  }
}
function bossSay(txt,dur){ bossBubble={txt,t:0,dur:dur||2.2}; }
function triggerBossFlail(source){
  const chest=boss.pts.chest, pelvis=boss.pts.pelvis;
  sGroan(); shake=9;
  setVel(chest,rnd(-240,240),-rnd(180,300));
  setVel(pelvis,rnd(-240,240),-rnd(120,260));
  for(const p of [boss.pts.la,boss.pts.ra,boss.pts.lh,boss.pts.rh]) setVel(p,rnd(-320,320),-rnd(100,320));
  bossSay('부스럭…!!',1.4);
  emitGameEvent(source==='silent'?'silent_event':'stir',{phase:'flail'});
}
function beginSilentEvent(index){
  const info=SILENT_EVENTS[index];
  silentVisited[index]=true;
  silentZone={active:true,t:8,index,hitCd:0,pulseDone:false,frontMsg:info.front,backMsg:info.back};
  emitGameEvent('silent_event',{phase:'start',index,front:info.front,back:info.back});
  toast('🤫 부장님이 선잠에 들었습니다 — 서로 다른 정보를 확인하세요');
}

function startGame(m){
  mode=m;
  campaignComplete=false;
  startLevel(1);
}
function startLevel(level){
  currentLevel=clamp(level,1,LEVELS.length); levelCfg=LEVELS[currentLevel-1];
  buildLevelWorld(currentLevel); rebuildBackdrop();
  const assist=mode==='solo'?0.72:1;
  diff={
    dmg:levelCfg.dmg*assist, drain:levelCfg.drain*assist,
    par:Math.round((70+WORLD/38)*(mode==='solo'?1.27:1)),
    grip:levelCfg.grip, slip:levelCfg.slip, stir:levelCfg.stir,
    eye:levelCfg.eye, cat:levelCfg.cat, passive:levelCfg.passive*assist, start:levelCfg.start
  };
  runTime=0; noiseCnt=0; wakeCnt=0; cpIdx=0;
  faults={front:{total:0,reasons:{},counts:{}}, back:{total:0,reasons:{},counts:{}}};
  actionHistory={front:[],back:[]}; lastGripChange={front:-99,back:-99};
  incident=null; incidentCd=0; incidentLog=[]; clipScore=0;
  gameEvents=[]; nextGameEventId=1;
  rescues={front:{score:0,counts:{}},back:{score:0,counts:{}}};
  friendSave=null; bothLoose=false; bothLooseAt=-99; nearMissArmed=false; nearMissT=0;
  soloHoldBest={front:0,back:0};
  eyeOpen={active:false,t:0,next:rnd(12,18),penaltyCd:0,moved:false};
  silentZone={active:false,t:0,index:-1,hitCd:0,pulseDone:false,frontMsg:'',backMsg:''}; silentVisited=[false,false];
  headHitCnt=0; gripDropCnt=0; manualResetCnt=0;
  trash={x:activeMap.trashX,spilled:false};
  taxi={x0:activeMap.taxiX0,x1:activeMap.taxiX1,active:true,entered:false,t:0,success:false,failed:false,
    leaveAt:15,gone:false,driveT:0,warned:false};
  mission=MISSIONS[(Math.random()*MISSIONS.length)|0];
  resetBottles();
  catZone.x0=activeMap.catX-140; catZone.x1=activeMap.catX+140; catZone.catX=activeMap.catX;
  catZone.spooked=false; catZone.runX=0;
  meter=diff.start; clearT=-1; gradeInfo=null; toasts=[]; particles=[];
  respawn(true); state='play';
  nextStir=runTime+rnd(14,22)*diff.stir;
  toast('LEVEL '+currentLevel+' — '+levelCfg.name+': '+levelCfg.desc);
  toast(activeMap.theme.name+' · '+Math.round(WORLD/10)+'m · 장애물 '+activeMap.obstacleCount+'개');
  toast('오늘의 미션 — '+mission.title+': '+mission.desc);
  if(currentLevel===1) toast(mode==='solo'?'연습 모드: 왼손이 뒷사람, 오른손이 앞사람!':'협동 모드: 서로 탓할 준비 되셨습니까');
}
function respawn(fullMeter){
  const cp=CHECKPOINTS[cpIdx];
  carriers=[
    new Carrier('back',  cp.x,     '#4f8ef7', KM_BACK,  '뒷사람'),
    new Carrier('front', cp.x+150, '#3ec9a7', KM_FRONT, '앞사람')
  ];
  const f=carriers[1].anchor(), b=carriers[0].anchor();
  buildBoss(f.x,f.y,b.x,b.y);
  if(fullMeter!==false) meter = wakeCnt===0?diff.start:Math.min(diff.start,66);
  actionHistory={front:[],back:[]}; lastGripChange={front:-99,back:-99};
  friendSave=null; bothLoose=false; bothLooseAt=-99; nearMissArmed=false; nearMissT=0; incident=null;
  timeScale=1; slowT=0; bossBubble=null;
  if(scrapeGain) scrapeGain.gain.value=0;
}

/* ---------------- 업데이트 ---------------- */
function update(dt){
  if(state!=='play') return;
  runTime+=dt; sinceDmg+=dt;
  if(diff.passive>0){ meter-=diff.passive*dt; sinceDmg=0; }
  if(incidentCd>0) incidentCd-=dt;
  if(micHitCd>0) micHitCd-=dt;
  if(nearMissT>0){ nearMissT-=dt; if(nearMissT<=0) nearMissArmed=false; }

  for(const c of carriers) c.update(dt);
  recordActions();
  // 캐리어끼리 겹침 방지(몸이 접혀 떨리는 것 방지)
  {
    const a=carriers[0], b=carriers[1], dxc=b.x-a.x, gap=44;
    if(Math.abs(dxc)<gap){
      const push=(gap-Math.abs(dxc))/2*(dxc>=0?1:-1);
      a.x-=push; b.x+=push;
    }
  }
  for(let s=0;s<SUB;s++) stepBossPhysics();

  const chest=boss.pts.chest, pelvis=boss.pts.pelvis, head=boss.pts.head;
  const anyGrip = carriers.some(c=>c.grip);
  const gripCount = carriers.filter(c=>c.grip).length;
  const avgSpd = (Math.abs(carriers[0].vx)+Math.abs(carriers[1].vx))/2;

  // Friend Save: 한 명이 버티고 다른 한 명이 다시 붙는 구조
  if(gripCount===1){
    const holder=carriers.find(c=>c.grip).side();
    if(!friendSave||friendSave.holder!==holder) friendSave={holder,t:0,soloAward:false};
    friendSave.t+=dt;
    soloHoldBest[holder]=Math.max(soloHoldBest[holder],friendSave.t);
    if(friendSave.t>=2&&!friendSave.soloAward){ friendSave.soloAward=true; addRescue(holder,'독박 운반',200); }
  } else if(gripCount===2&&friendSave){
    if(friendSave.t<=3.2) addRescue(friendSave.holder,'팀워크 구조',250);
    friendSave=null;
  } else if(gripCount===0){ friendSave=null; }
  if(gripCount===0&&!bothLoose){ bothLoose=true; bothLooseAt=runTime; }
  if(gripCount>0&&bothLoose) bothLoose=false;

  const headVy=(head.y-head.py)/SDT;
  if(gripCount<2&&head.y>G_Y-45&&headVy>100){ nearMissArmed=true; nearMissT=0.65; }

  // 수면 단계: 반수면에서는 갑자기 눈을 뜨며, 입력하면 추가 피해
  if(!eyeOpen.active&&meter<=30&&runTime>eyeOpen.next){
    eyeOpen.active=true; eyeOpen.t=rnd(2.2,3); eyeOpen.moved=false; eyeOpen.penaltyCd=0;
    emitGameEvent('wake_eye',{phase:'start',duration:eyeOpen.t});
    toast('👀 움직이지 마세요.'); bossSay('……',eyeOpen.t); sGroan();
  }
  if(eyeOpen.active){
    eyeOpen.t-=dt; eyeOpen.penaltyCd-=dt;
    const moved=['KeyA','KeyD','KeyW','KeyS','ArrowLeft','ArrowRight','ArrowUp','ArrowDown'].some(k=>keys[k]);
    if(moved&&eyeOpen.penaltyCd<=0){
      if(!eyeOpen.moved) emitGameEvent('wake_eye',{phase:'caught'});
      eyeOpen.moved=true; eyeOpen.penaltyCd=0.32; meter-=3.5*diff.drain; sinceDmg=0;
      toast('👀 들켰습니다! 움직이지 마세요'); shake=4;
    }
    if(eyeOpen.t<=0){
      eyeOpen.active=false; eyeOpen.next=runTime+rnd(15,24)*diff.stir;
      if(!eyeOpen.moved) addRescue('team','눈치 만점',100);
      emitGameEvent('wake_eye',{phase:eyeOpen.moved?'failed':'success'});
      bossSay('…zzz',1.4); sSnore();
    }
  }

  // 실제 마이크: 일반 구간과 Silent Zone의 임계값을 다르게 적용
  const liveMic=sampleMic();
  if(micEnabled&&liveMic>(silentZone.active?0.09:0.18)&&micHitCd<=0){
    micHitCd=silentZone.active?0.55:0.9;
    const side=Math.abs(carriers[0].vx)>Math.abs(carriers[1].vx)?'back':'front';
    const dmg=silentZone.active?6:4; meter-=dmg*diff.drain; noiseCnt++; sinceDmg=0;
    addFault(side,dmg,'mic'); toast(silentZone.active?'🤫 조용히 하세요!':'🔊 너무 시끄럽습니다!'); shake=5;
  }
  const silentXs=activeMap.silentXs;
  for(let i=0;i<silentXs.length;i++) if(!silentZone.active&&!silentVisited[i]&&chest.x>silentXs[i]) beginSilentEvent(i);
  if(silentZone.active){
    silentZone.t-=dt;
    if(!silentZone.pulseDone&&silentZone.t<=5){
      silentZone.pulseDone=true; triggerBossFlail('silent'); toast('부장님이 크게 뒤척였다!');
    }
    if(silentZone.t<=0){
      const index=silentZone.index; silentZone.active=false;
      emitGameEvent('silent_event',{phase:'success',index}); addRescue('team','무음 통과',150);
    }
  }

  // 끌기(드래그) 판정
  const touching = chest.onGround||pelvis.onGround||head.onGround;
  if(anyGrip && touching && avgSpd>90){
    meter -= 4.5*dt*diff.drain*sleepSensitivity(); sinceDmg=0;
    if(scrapeGain&&!muted) scrapeGain.gain.value=Math.min(0.12,avgSpd/2200);
    dragNoiseT+=dt;
    if(dragNoiseT>1.1){ dragNoiseT=0; noiseCnt++;
      const side = head.onGround||chest.onGround?'front':'back';
      addFault(side,3,'drag');
      spawnP('text',pelvis.x,pelvis.y-20,'드르륵…');
    }
  } else if(scrapeGain) scrapeGain.gain.value*=0.8;

  // 방치 판정
  if(!anyGrip){
    const near=Math.min(dist2(carriers[0].x,carriers[0].y,chest.x,chest.y),
                        dist2(carriers[1].x,carriers[1].y,chest.x,chest.y));
    if(near>430 && !(chest.x>GOAL_X0)){
      meter-=2.5*dt*diff.drain;
      if(Math.random()<dt*0.5) addFault(carriers[0].x>carriers[1].x?'back':'front',1,'abandon');
    }
  }

  // 고양이
  if(!catZone.spooked){
    for(const c of carriers){
      if(c.x>catZone.x0&&c.x<catZone.x1&&Math.abs(c.vx)>diff.cat){
        catZone.spooked=true; catZone.runX=catZone.catX;
        sMeow(); meter-=8*diff.drain; noiseCnt++; sinceDmg=0;
        addFault(c.side(),8,'cat'); shake=7;
        emitGameEvent('cat',{side:c.side(),reason:'cat'});
        toast('🐈 고양이가 기겁했다!! ('+c.label+' 과실)');
        bossSay('…읏, 시끄러…',1.6);
      }
    }
  } else if(catZone.runX>-200) catZone.runX-=520*dt;

  // 소주병
  for(const b of bottles){
    if(!b.k){
      for(const c of carriers){
        if(Math.abs(c.x+c.w/2-b.x)<20 && Math.abs(c.vx)>90 && c.grounded){
          b.k=true; b.vx=c.vx*1.8; sKick(); meter-=4*diff.drain; noiseCnt++; sinceDmg=0;
          addFault(c.side(),4,'bottle'); spawnP('text',b.x,G_Y-40,'데구르르!');
          emitGameEvent('bottle',{side:c.side(),reason:'bottle',phase:'kick'});
        }
      }
    } else if(!b.done){
      b.x+=b.vx*dt; b.rot+=b.vx*dt*0.03; b.vx*=Math.pow(0.2,dt);
      if(Math.abs(b.vx)<8) b.done=true;
      if(!trash.spilled&&Math.abs(b.x-trash.x)<25){
        trash.spilled=true; b.done=true; sKick(); noiseCnt++; meter-=7*diff.drain;
        emitGameEvent('bottle',{phase:'chain'});
        toast('🗑 쓰레기봉투 → 고양이 → 택시 경적!'); shake=8;
        if(!catZone.spooked){ catZone.spooked=true; catZone.runX=catZone.catX; sMeow(); }
        setVel(chest,rnd(-180,180),-220); bossSay('으음… 시끄러…',1.8);
      }
    }
  }

  // 체크포인트
  const activeCps=CHECKPOINTS.slice(0,levelCfg.cps);
  for(let i=cpIdx+1;i<activeCps.length;i++){
    if(chest.x>activeCps[i].x){
      cpIdx=i; sChime(); toast('📍 체크포인트! 부장님이 편안해 보인다');
      if(meter<=10) addRescue('team','극한의 눈치',500);
    }
  }

  // 택시: 제한 시간 안에 도착해서 부장님을 내려놓으면 800m를 건너뛴다. 늦으면 떠난다.
  if(taxi.active&&!taxi.success&&!taxi.failed){
    const remain=taxi.leaveAt-runTime;
    if(remain<=0){
      taxi.failed=true; taxi.active=false; taxi.gone=true;
      toast('🚕 택시가 떠났다… 조금만 빨랐다면'); sSlip();
    } else {
      if(remain<=5&&!taxi.warned){ taxi.warned=true; toast('🚕 택시 출발 5초 전! 서두르세요'); }
      if(chest.x>taxi.x0-80&&chest.x<taxi.x1+80){
        if(!taxi.entered){ taxi.entered=true; toast('🚕 뒷문에 조심히 내려놓으면 '+Math.round(activeMap.taxiSkip/10)+'m 단축!'); }
        taxi.t+=dt;
        const inside=chest.x>taxi.x0+35&&chest.x<taxi.x1-35&&pelvis.x>taxi.x0+20&&pelvis.x<taxi.x1-20;
        if(inside&&!anyGrip&&(chest.onGround||pelvis.onGround)&&bossVel(chest)<95){
          taxi.success=true; taxi.active=false; addRescue('team','택시 탑승 성공',400); sBell();
          const dx=activeMap.taxiSkip; for(const c of carriers)c.x+=dx; for(const p of boss.list){p.x+=dx;p.px+=dx;}
          toast('🚕 거리 -'+Math.round(dx/10)+'m! 기사님, 명진아파트로요');
        } else if(taxi.t>12){ taxi.failed=true; taxi.active=false; toast('🚕 “손님, 그냥 내려주세요.”'); }
      }
    }
  }
  if(taxi.gone) taxi.driveT+=dt;

  // 뒤척임 이벤트
  if(stirPending===null && runTime>nextStir){
    stirPending = Math.random()<0.45 ? 'flail':'talk';
    stirWarnT=1.25;
    bossSay('으으음…',1.2);
  }
  if(stirPending!==null){
    stirWarnT-=dt;
    if(stirWarnT<=0){
      if(stirPending==='flail'){
        triggerBossFlail('normal');
        toast('부장님이 크게 뒤척였다!');
      } else {
        sSnore(); bossSay(SLEEPTALK[(Math.random()*SLEEPTALK.length)|0],2.6);
      }
      stirPending=null;
      const stage=sleepStage();
      nextStir=runTime+rnd(18,32)*diff.stir*(stage==='edge'?0.35:stage==='half'?0.55:stage==='light'?0.78:1);
    }
  }

  // 코골이
  if(sinceDmg>2.5){
    snoreT+=dt;
    if(snoreT>2.3){ snoreT=0; sSnore(); spawnP('z',head.x,head.y-20); }
  }

  // 기상(게임오버)
  meter=clamp(meter,0,100);
  if(meter<=0 && state==='play'){
    wakeCnt++; slowT=0.9; timeScale=0.25;
    lastWakeLine=WAKELINES[(Math.random()*WAKELINES.length)|0];
    lastRemainM=Math.max(0,Math.round((GOAL_CX-chest.x)/10));
    wakeAnimT=0;
    incident=null; if(scrapeGain) scrapeGain.gain.value=0;
    state='wake'; sGroan(); sThud(0.8);
  }

  // 클리어 판정
  if(state==='play' && chest.x>GOAL_X0 && chest.x<GOAL_X1 && !anyGrip){
    const spd=bossVel(chest);
    const grounded=chest.onGround||pelvis.onGround;
    if(spd<70 && grounded){
      state='clear'; clearT=0; sBell();
      const par=diff.par;
      const totalFault=faults.front.total+faults.back.total;
      let pts=100 - wakeCnt*25 - Math.max(0,noiseCnt-2)*4 - Math.max(0,runTime-par)*0.2
        - Math.min(20,totalFault*0.08) - manualResetCnt*4;
      let g,cap;
      if(pts>=90&&wakeCnt===0){g='S';cap='차기 임원감. 부장님이 아침에 해장국을 쏜다.';}
      else if(pts>=75){g='A';cap='"자네만 믿네." — 두터운 신임을 얻었다.';}
      else if(pts>=58){g='B';cap='무난한 직장생활이 이어진다.';}
      else if(pts>=40){g='C';cap='월요일 아침, 어쩐지 눈치가 보인다.';}
      else if(pts>=22){g='D';cap='사내에 팀 이동설이 돈다.';}
      else {g='F';cap='지방 발령. 조용히 짐을 싸자.';}
      gradeInfo={g,cap,pts:Math.round(pts),missionOK:missionPassed(),level:currentLevel};
      campaignComplete=currentLevel===LEVELS.length;
      if(scrapeGain) scrapeGain.gain.value=0;
    }
  }

  // 카메라
  const midX=(carriers[0].x+carriers[1].x)/2;
  camX = lerp(camX, clamp(midX-560, 0, WORLD-VW), 0.12);
  if(shake>0) shake=Math.max(0,shake-40*dt);

  // 파티클/토스트/말풍선
  for(const p of particles){ p.t+=dt; p.x+=p.vx*dt; p.y+=p.vy*dt; if(p.type==='star'||p.type==='bottle'){p.vy+=900*dt;} }
  particles=particles.filter(p=>p.t<1.4);
  for(const t of toasts) t.t+=dt;
  toasts=toasts.filter(t=>t.t<3.2);
  if(bossBubble){ bossBubble.t+=dt; if(bossBubble.t>bossBubble.dur) bossBubble=null; }

  // 디버그
  if(DEBUG){
    if(pressed['KeyK']) meter-=15;
    if(pressed['Digit0']) meter=100;
    if(pressed['KeyI']) triggerIncident(boss.pts.head,900,10);
    if(pressed['KeyG']){
      const dx=GOAL_CX-boss.pts.chest.x;
      for(const c of carriers)c.x+=dx;
      for(const p of boss.list){p.x+=dx;p.px+=dx;}
    }
    if(pressed['Digit9']){
      const dx=600;
      for(const c of carriers) c.x+=dx;
      for(const p of boss.list){ p.x+=dx; p.px+=dx; }
    }
  }
}

/* ---------------- 렌더링 ---------------- */
function draw(dt){
  cx.save();
  cx.clearRect(0,0,VW,VH);
  const sky=cx.createLinearGradient(0,0,0,VH);
  sky.addColorStop(0,activeMap.theme.top); sky.addColorStop(0.62,activeMap.theme.near); sky.addColorStop(1,activeMap.theme.bottom);
  cx.fillStyle=sky; cx.fillRect(0,0,VW,VH);

  // 별/달
  for(const s of starsA){
    cx.globalAlpha=0.4+0.4*Math.sin(titleT*1.5+s.tw);
    cx.fillStyle='#dfe6ff'; cx.beginPath(); cx.arc(s.x,s.y,s.r,0,7); cx.fill();
  }
  cx.globalAlpha=1;
  cx.fillStyle='#ffe9b8'; cx.beginPath(); cx.arc(1080,110,44,0,7); cx.fill();
  cx.fillStyle='rgba(255,233,184,0.12)'; cx.beginPath(); cx.arc(1080,110,74,0,7); cx.fill();
  cx.fillStyle='#0e1330'; cx.beginPath(); cx.arc(1062,98,12,0,7); cx.fill();
  cx.beginPath(); cx.arc(1096,124,8,0,7); cx.fill();

  const shx=(Math.random()*2-1)*shake, shy=(Math.random()*2-1)*shake;

  // 원경 빌딩
  drawBuildings(bldFar, 0.25);
  drawBuildings(bldNear, 0.55);

  cx.save();
  cx.translate(-camX+shx, shy-CAM_YUP);

  drawLevel();

function drawCarrier(c){

  const ph=c.walkPh;
  cx.strokeStyle='#20263e'; cx.lineWidth=6; cx.lineCap='round';
  const legA=Math.sin(ph)* (Math.abs(c.vx)>20?7:0), legB=-legA;

  cx.beginPath(); cx.moveTo(cxm+5,y+h-16); cx.lineTo(cxm+5+legB,y+h); cx.stroke();
  cx.fillStyle=c.color; roundRect(x,y+14,w,h-26,8); cx.fill();

  cx.fillStyle='#f0b6a0'; cx.beginPath(); cx.arc(cxm,y+8,9,0,7); cx.fill();
  cx.fillStyle='#2b2f45';
  cx.beginPath(); cx.arc(cxm,y+5.4,9,Math.PI,0); cx.fill();
  cx.fillStyle='#26293a';
  cx.beginPath(); cx.arc(cxm+c.facing*3.4,y+8.6,1.7,0,7); cx.fill();
  // 팔: 그립 앵커까지
  const an=c.anchor();
  cx.strokeStyle=c.color; cx.lineWidth=6;
  if(c.grip){
    cx.beginPath(); cx.moveTo(cxm-4,y+20); cx.lineTo(an.x-3,an.y); cx.stroke();
    cx.beginPath(); cx.moveTo(cxm+4,y+20); cx.lineTo(an.x+3,an.y); cx.stroke();
  } else {
    const sw=Math.sin(ph)*4;
    cx.beginPath(); cx.moveTo(cxm-6,y+20); cx.lineTo(cxm-9+sw,y+36); cx.stroke();
    cx.beginPath(); cx.moveTo(cxm+6,y+20); cx.lineTo(cxm+9-sw,y+36); cx.stroke();
  }
  cx.lineWidth=1;
  // 스트레치 경고(땀)
  if(c.grip && c.stretchShown>60){
    cx.fillStyle='#9ed8ff';

  // 라벨
  cx.font='bold 12px sans-serif'; cx.textAlign='center';
  cx.fillStyle='rgba(255,255,255,0.55)';
  cx.fillText(c.label+(mode==='solo'?(c.role==='front'?' (오른손)':' (왼손)'):''),cxm,y-2);

  if(c.x<860 && state==='play'){
    cx.fillStyle='rgba(223,230,255,0.75)'; cx.font='12px sans-serif';
    const txt = TOUCH_UI?'◀▶ 이동 · ▲ 점프 · ▼ 숙이기 · 그립':c.role==='front'?'←→ 이동 · ↑ 점프 · ↓ 숙이기 · Shift/L 그립':'A D 이동 · W 점프 · S 숙이기 · F 그립';
    cx.fillText(txt,cxm,y+h+18);
  }
}

    cx.fillText('과실  뒷사람 '+pct.back+'% : '+pct.front+'% 앞사람   ·   클립 점수 '+clipScore+'   ·   수동 재정비 '+manualResetCnt+'회',182,500);
    cx.fillStyle=gradeInfo.missionOK?'#7dffa8':'#ff8d8d'; cx.font='bold 16px sans-serif';
    cx.fillText((gradeInfo.missionOK?'✓ 미션 성공  ':'✕ 미션 실패  ')+mission.title+' — '+mission.desc,182,535);
    cx.textAlign='center'; cx.fillStyle='#ffd9a0'; cx.font='bold 19px sans-serif';
    cx.fillText(campaignComplete?'월요일 출근 생존 확정. 전설이 되셨습니다.':'다음 관문: LEVEL '+(currentLevel+1)+' · '+LEVELS[currentLevel].name,VW/2,605);

}

/* ---------------- 화면 전환 입력 ---------------- */
let touchMenuSignature='';
function syncTouchMenu(){
  if(!TOUCH_UI) return;
  const controls=document.getElementById('touchControls'), menu=document.getElementById('touchMenu');
  const sig=state+'|'+campaignComplete+'|'+muted; if(sig===touchMenuSignature) return;
  touchMenuSignature=sig;
  controls.classList.toggle('can-move',state==='play');
  let items=[];
  if(state==='play') items=[['Ⅱ 일시정지','KeyP'],['↻ 재정비','KeyR'],[muted?'🔊 소리':'🔇 음소거','KeyM']];
  else if(state==='pause') items=[['▶ 계속','KeyP'],['↻ 재정비','KeyR'],['⌂ 타이틀','Escape']];
  else if(state==='wake') items=[['▶ 계속','KeyR'],['↻ 다시하기','KeyT'],['⌂ 타이틀','Escape']];
  else if(state==='clear'&&!campaignComplete) items=[['다음 단계','Enter'],['↻ 다시하기','KeyT'],['⌂ 타이틀','Escape']];
  else if(state==='clear') items=[['LEVEL 1부터','KeyT'],['⌂ 타이틀','Escape']];
  const menuBtns=[...menu.querySelectorAll('.touchBtn')];
  menuBtns.forEach((btn,i)=>{
    const item=items[i]; btn.hidden=!item;
    if(item){ btn.textContent=item[0]; btn.dataset.code=item[1]; btn.setAttribute('aria-label',item[0]); }
    else { btn.textContent=''; delete btn.dataset.code; }
  });
  menu.classList.toggle('visible',items.length>0);
}
function metaInput(){
  if(state==='title'){
    let m=null;
    if(pressed['Digit1']) m='solo';
    if(pressed['Digit2']) m='duo';
    if(clickPt){
      if(clickPt.y>300&&clickPt.y<386){
        if(clickPt.x>VW/2-330&&clickPt.x<VW/2-30) m='solo';
        if(clickPt.x>VW/2+30&&clickPt.x<VW/2+330) m='duo';
      }
    }
    if(m) startGame(m);
  } else if(state==='play'){
    if(pressed['KeyR']){ manualResetCnt++; respawn(false); toast('체크포인트에서 재정비! 숙면도는 회복되지 않습니다'); }
    if(pressed['KeyP']||pressed['Escape']){ state='pause'; if(scrapeGain)scrapeGain.gain.value=0; }
  } else if(state==='pause'){
    if(pressed['KeyP']) state='play';
    if(pressed['KeyR']){ manualResetCnt++; respawn(false); state='play'; }
    if(pressed['Escape']) state='title';
  } else if(state==='wake'){
    if(pressed['KeyR']){ respawn(); state='play'; }
    if(pressed['KeyT']) startLevel(currentLevel);
  } else if(state==='clear'){
    if(pressed['Enter']&&currentLevel<LEVELS.length) startLevel(currentLevel+1);
    if(pressed['KeyT']) campaignComplete?startGame(mode):startLevel(currentLevel);
    if(pressed['Escape']) state='title';
  }
  if(pressed['KeyM']){ muted=!muted; if(master) master.gain.value=muted?0:0.5; }
  if(pressed['KeyV']) toggleMic();
}

/* ---------------- 메인 루프 ---------------- */
let lastT=0, acc=0;
carriers=[
  new Carrier('back', 300,'#4f8ef7',KM_BACK,'뒷사람'),
  new Carrier('front',450,'#3ec9a7',KM_FRONT,'앞사람')
];
resetBottles();
{ const f=carriers[1].anchor(), b=carriers[0].anchor(); buildBoss(f.x,f.y,b.x,b.y); }
camX=0;
function frame(t){
  requestAnimationFrame(frame);
  const rdt=Math.min(0.05,(t-lastT)/1000||0.016); lastT=t;
  titleT+=rdt;
  if(slowT>0){ slowT-=rdt; if(slowT<=0) timeScale=1; }
  acc+=rdt*timeScale;
  let n=0;
  while(acc>=FDT && n<4){
    metaInput();
    if(state==='play') update(FDT);
    else if(state==='title'){
      // 타이틀 뒤에서 부장님이 살아있는 물리로 잠자는 데모
      for(let s=0;s<SUB;s++) stepBossPhysics();
      snoreT+=FDT; if(snoreT>2.3){snoreT=0; sSnore(); spawnP('z',boss.pts.head.x,boss.pts.head.y-20);}
      for(const p of particles){p.t+=FDT; p.x+=p.vx*FDT; p.y+=p.vy*FDT;}
      particles=particles.filter(p=>p.t<1.4);
    }
    for(const k in pressed) pressed[k]=false;
    clickPt=null;
    acc-=FDT; n++;
  }
  syncTouchMenu();
  draw(rdt);
}
requestAnimationFrame(frame);
</script>
